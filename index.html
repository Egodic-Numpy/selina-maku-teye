){page=Math.max(0,Math.min(1,n));document.querySelectorAll('.page').forEach((el,i)=>el.classList.toggle('active',i===page));document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===1;document.getElementById('count').textContent=(page+1)+' / 2 · '+(page?'Order of service':'In loving memory');for(let format of ['png','jpg'])document.getElementById(format).href=names[page]+'.'+format;window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('back').onclick=()=>show(page-1);document.getElementById('next').onclick=()=>show(page+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(page+1);if(e.key==='ArrowLeft')show(page-1)});let startX=0;document.querySelector('main').addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.querySelector('main').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>70)show(page+(dx<0?1:-1))},{passive:true});</script></body></html>
